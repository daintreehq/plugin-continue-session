name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Typecheck, test and validate
        run: npm run check

      - name: Package
        run: npm run package

      # The archive's entry, loaded the way the plugin worker loads it, without
      # activating it: activation would create an index folder under $HOME.
      - name: Load the built entry
        run: node --input-type=module -e "const m = await import('./dist/index.mjs'); if (typeof m.activate !== 'function') throw new Error('dist/index.mjs exports no activate()');"
